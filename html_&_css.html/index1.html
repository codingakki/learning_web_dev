<!-- creating a animation of ball using css. the ball will bounce two times in the container -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Exercise</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        height: 60vh;
        width: 100vw;
        background-color: pink;
        position: relative;
        overflow: hidden;
      }
      .ball {
        height: 100px;
        width: 100px;
        border-radius: 50px;
        background-color: black;
        position: absolute;
        bottom: 0;
        left: 0;
        animation:animateX 3s linear  infinite,
                  animateY 1s ease-out infinite alternate;
      }

      @keyframes animateY {
        from {
          bottom: 0;
        }
        to {
          bottom: 100%;
        }
      }
      @keyframes animateX {
        from {
          left: 0;
        }
        to {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="ball"></div>
    </div>
  </body>
</html>
